<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Character Forge 001</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11141d;color:#eee;font:14px system-ui}header{padding:12px 16px;background:#202638;display:flex;justify-content:space-between;align-items:center}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;height:calc(100dvh - 53px)}#view{position:relative;min-width:0;min-height:300px;overflow:hidden}#view canvas{display:block;position:absolute;inset:0;width:100%!important;height:100%!important;touch-action:none}aside{min-width:0}aside{overflow:auto;padding:14px;background:#1c2230}button,input,select{background:#303b50;color:white;border:1px solid #52617a;border-radius:6px;padding:7px;max-width:100%}button{cursor:pointer}button:hover{background:#435573}.actions{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}label{display:block;margin:10px 0 4px;color:#bbc7d9}input[type=number]{width:100%}input[type=color]{padding:1px;width:60px;height:32px}h3{margin:16px 0 6px}small{color:#a8b6c8}.triple{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.triple input{min-width:0}#parts{width:100%}#status{position:absolute;bottom:12px;left:12px;background:#111a;padding:8px;border-radius:6px;pointer-events:none}@media(max-width:700px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:53dvh auto;height:auto}aside{min-height:47dvh}}</style></head>
<body><header><b>◈ Character Forge <small>001</small></b><span>Geometry Workshop</span></header><main><div id="view"><div id="status">Loading 3D engine…</div><div id="error" style="display:none;position:absolute;z-index:3;top:12px;left:12px;right:12px;background:#6d2333;color:white;padding:12px;border-radius:8px;white-space:pre-wrap"></div></div><aside>
<label>Character style</label><select id="style"><option value="humanoid">Humanoid</option><option value="quadruped">Quadruped</option><option value="crawler">Crawler</option><option value="abstract">Abstract</option></select>
<div class="actions"><button id="generate">Generate</button><button id="mutate">Mutate</button><button id="clear">Clear</button></div>
<h3>Shapes</h3><div class="actions"><button data-add="box">+ Block</button><button data-add="cylinder">+ Cylinder</button><button data-add="sphere">+ Sphere</button></div>
<label>Parts</label><select id="parts" size="5"></select><div class="actions"><button id="duplicate">Duplicate</button><button id="remove">Delete</button></div>
<div id="editor"><label>Name</label><input id="name" type="text"><label>Shape</label><select id="shape"><option value="box">Block</option><option value="cylinder">Cylinder</option><option value="sphere">Sphere</option></select><label>Color</label><input id="color" type="color">
<h3>Position (X Y Z)</h3><div class="triple" id="pos"></div><h3>Scale (X Y Z)</h3><div class="triple" id="scale"></div><h3>Rotation (degrees X Y Z)</h3><div class="triple" id="rot"></div></div>
<h3>Character files</h3><div class="actions"><button id="save">Export JSON</button><button id="load">Import JSON</button><input id="file" type="file" accept=".json,application/json" hidden></div><small>All edits are local to your browser. Three.js loads from a CDN.</small>
</aside></main>
<script>window.addEventListener("error",e=>{const x=document.getElementById("error");x.style.display="block";x.textContent="JavaScript error: "+e.message});window.addEventListener("unhandledrejection",e=>{const x=document.getElementById("error");x.style.display="block";x.textContent="Module error: "+String(e.reason)});</script><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=id=>document.getElementById(id),view=$('view'),scene=new THREE.Scene();scene.background=new THREE.Color('#141a27');
const camera=new THREE.PerspectiveCamera(45,1,.1,200);camera.position.set(7,5,9);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1.5,0);controls.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x52607b,2));
const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(5,9,7);scene.add(light);
const grid=new THREE.GridHelper(30,30,0x46516b,0x2d364a);scene.add(grid);
let parts=[],selected=-1;const meshes=[];
const rnd=(a,b)=>a+Math.random()*(b-a),palette=['#5fa8ff','#f7ae60','#8bd6a2','#e6a0e8','#f17d8c','#e7d887'];
const mk=(shape,name,p,s,c)=>({shape,name,pos:p,scale:s,rot:[0,0,0],color:c||palette[Math.floor(Math.random()*palette.length)]});
function rebuild(){for(const m of meshes)scene.remove(m);meshes.length=0;parts.forEach((p,i)=>{const geo=p.shape==='box'?new THREE.BoxGeometry(1,1,1):p.shape==='sphere'?new THREE.SphereGeometry(.5,24,16):new THREE.CylinderGeometry(.5,.5,1,24);const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:p.color,roughness:.7,metalness:.08,emissive:i===selected?0x202020:0}));m.position.set(...p.pos);m.scale.set(...p.scale);m.rotation.set(...p.rot.map(v=>v*Math.PI/180));m.userData.index=i;scene.add(m);meshes.push(m)});$('parts').innerHTML=parts.map((p,i)=>'<option value="'+i+'">'+p.name+'</option>').join('');$('parts').value=selected;edit()}
function edit(){const p=parts[selected];$('editor').style.opacity=p?1:.4;for(const id of ['name','shape','color']){$(id).disabled=!p;if(p)$(id).value=p[id]}for(const [id,key] of [['pos','pos'],['scale','scale'],['rot','rot']]){const box=$(id);box.innerHTML='';for(let j=0;j<3;j++){const input=document.createElement('input');input.type='number';input.step=key==='rot'?'5':'.1';input.value=p?p[key][j]:0;input.disabled=!p;input.onchange=()=>{p[key][j]=Number(input.value);rebuild()};box.append(input)}}}
function select(i){selected=i;rebuild()}
function add(p){parts.push(p);select(parts.length-1)}
function generate(){parts=[];selected=-1;const style=$('style').value,co=palette[Math.floor(Math.random()*palette.length)],factor=rnd(.8,1.3);
const push=(sh,n,x,y,z,sx,sy,sz)=>parts.push(mk(sh,n,[x*factor,y*factor,z*factor],[sx*factor,sy*factor,sz*factor],co));
if(style==='humanoid'){push('box','Torso',0,2,0,1.2,1.6,.7);push('sphere','Head',0,3.2,0,.9,.95,.85);for(const d of [-1,1]){push('cylinder','Arm',d*.95,2.1,0,.36,1.45,.36);push('cylinder','Leg',d*.36,.75,0,.45,1.5,.45);push('box','Foot',d*.36,.12,.22,.55,.28,.85)}}
else if(style==='quadruped'){push('box','Body',0,1.55,0,1.2,1.1,2.4);push('sphere','Head',0,2,1.55,1,1,1);for(const x of [-.45,.45])for(const z of [-.85,.85])push('cylinder','Leg',x,.65,z,.3,1.3,.3);push('cylinder','Tail',0,1.85,-1.65,.24,1.5,.24)}
else if(style==='crawler'){push('sphere','Core',0,1.2,0,1.7,1,1.8);for(let i=0;i<8;i++){const a=i*Math.PI/4;push('cylinder','Appendage',Math.cos(a)*1.2,.75,Math.sin(a)*1.2,.23,1.5,.23)}push('sphere','Eye',0,1.65,.8,.45,.45,.45)}
else{for(let i=0;i<12;i++)push(['box','sphere','cylinder'][Math.floor(rnd(0,3))],'Part '+(i+1),rnd(-1.5,1.5),rnd(.4,3.4),rnd(-1.5,1.5),rnd(.3,1.2),rnd(.3,1.4),rnd(.3,1.2))}
parts.forEach(p=>{p.scale=p.scale.map(v=>+(v*rnd(.8,1.2)).toFixed(2))});select(0)}
$('generate').onclick=generate;
$('mutate').onclick=()=>{parts.forEach(p=>{p.pos=p.pos.map(v=>v+rnd(-.16,.16));p.scale=p.scale.map(v=>Math.max(.1,v*rnd(.87,1.13)))});rebuild()};
$('clear').onclick=()=>{parts=[];select(-1)};
document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(mk(b.dataset.add,'New '+b.dataset.add,[0,1.5,0],[1,1,1])));
$('parts').onchange=e=>select(Number(e.target.value));
$('duplicate').onclick=()=>{if(selected<0)return;const p=structuredClone(parts[selected]);p.name+=' copy';p.pos[0]+=.4;add(p)};
$('remove').onclick=()=>{if(selected<0)return;parts.splice(selected,1);select(Math.min(selected,parts.length-1))};
for(const id of ['name','shape','color'])$(id).onchange=e=>{if(selected<0)return;parts[selected][id]=e.target.value;rebuild()};
$('save').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,parts},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='character-forge.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('load').onclick=()=>$('file').click();$('file').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.parts))throw Error('Missing parts');parts=data.parts.filter(p=>['box','sphere','cylinder'].includes(p.shape)&&Array.isArray(p.pos)&&Array.isArray(p.scale)&&Array.isArray(p.rot));select(parts.length?0:-1)}catch(err){alert('Could not import: '+err.message)}e.target.value=''};
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;const rect=renderer.domElement.getBoundingClientRect();mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(meshes);if(hits.length)select(hits[0].object.userData.index)});
function frame(){requestAnimationFrame(frame);const w=view.clientWidth,h=view.clientHeight;if(renderer.domElement.width!==Math.floor(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.floor(h*renderer.getPixelRatio())){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}controls.update();renderer.render(scene,camera)}generate();$("status").textContent="Drag to orbit · Pinch to zoom · Tap a part to edit";frame();
</script></body></html>
